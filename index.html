<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#12151b" />
<meta name="description" content="Guitar Buddy — learn the guitar fretboard on your phone." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Guitar Buddy</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Guitar Buddy</h1>
    </div>
    <div class="top-right">
      <div class="scoreboard" id="scoreboard">
        <div class="score" id="score" aria-live="polite">0<span class="score-sep">/</span><span class="score-total">10</span></div>
        <div class="best" id="best">Best —</div>
      </div>
      <button class="icon-btn" id="soundBtn" aria-label="Sound" aria-pressed="true">
        <svg class="ico-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9v6h3.5L13 19V5L7.5 9H4z" />
          <path d="M16.5 8.5a5 5 0 0 1 0 7" />
          <path d="M19 6a8.5 8.5 0 0 1 0 12" />
        </svg>
        <svg class="ico-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
          <path d="M4 9v6h3.5L13 19V5L7.5 9H4z" />
          <path d="M17 9.5l4 5M21 9.5l-4 5" />
        </svg>
      </button>
      <button class="icon-btn" id="gearBtn" aria-label="Practice settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h8M18 6h2M4 12h4M14 12h6M4 18h8M18 18h2" />
          <circle cx="15" cy="6" r="2.2" />
          <circle cx="11" cy="12" r="2.2" />
          <circle cx="15" cy="18" r="2.2" />
        </svg>
      </button>
    </div>
  </header>

  <nav class="modes" id="modes" role="tablist" aria-label="Practice modes">
    <button class="mode-btn is-active" role="tab" aria-selected="true" data-mode="name">Name Note</button>
    <button class="mode-btn" role="tab" aria-selected="false" data-mode="find">Find Note</button>
    <button class="mode-btn" role="tab" aria-selected="false" data-mode="explore">Explore</button>
  </nav>

  <button class="filters" id="filters" hidden></button>

  <div class="prompt" id="prompt">Press start to begin a session.</div>

  <div class="progress" id="progress" aria-hidden="true">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <main class="neck-wrap">
    <div class="neck" id="neck">
      <div class="string-heads" id="stringHeads"></div>
      <div class="board" id="board" aria-label="Guitar fretboard, nut to 12th fret">
        <div class="nut-row" aria-hidden="true">
          <div class="nut-gutter"></div>
          <div class="nut"></div>
        </div>
      </div>
    </div>
  </main>

  <section class="pad" id="notePad" aria-label="Note answers"></section>

  <section class="explore-tools" id="exploreTools" hidden>
    <button class="ghost-btn" id="toggleAll" aria-pressed="false">Show all notes</button>
    <p class="hint" id="exploreHint">Tap any position on the neck to reveal its note.</p>
  </section>

  <footer class="footer">
    <button class="start-btn" id="startBtn">Start</button>
  </footer>

</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-body" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip" aria-hidden="true"></div>

    <div class="sheet-head">
      <h2 id="sheetTitle">Practice settings</h2>
      <button class="icon-btn" data-close aria-label="Close settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>

    <section class="field">
      <h3>Zone</h3>
      <div class="chips" id="zoneChips"></div>
    </section>

    <section class="field">
      <h3>Positions</h3>
      <label class="switch">
        <input type="checkbox" id="dotsOnly" />
        <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
        <span class="switch-text">Only on the dots
          <small>Frets 3, 5, 7, 9 and 12</small>
        </span>
      </label>
    </section>

    <section class="field">
      <h3>Scale</h3>
      <div class="selects">
        <label class="sel"><span>Scale</span><select id="scaleSel"></select></label>
        <label class="sel"><span>Root</span><select id="rootSel"></select></label>
      </div>

      <label class="switch">
        <input type="checkbox" id="droneToggle" />
        <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
        <span class="switch-text">Drone
          <small>Rings the root in Explore, once a scale is picked</small>
        </span>
      </label>

      <label class="sel"><span>Drone sound</span><select id="droneVoiceSel"></select></label>
    </section>

    <section class="field">
      <h3>Beat</h3>
      <label class="sel"><span>Style</span><select id="beatSel"></select></label>

      <div class="tempo">
        <div class="tempo-head">
          <span>Tempo</span>
          <output id="tempoOut" for="tempoRange">90 BPM</output>
        </div>
        <div class="tempo-row">
          <button class="tempo-btn" id="tempoDown" aria-label="Slower">&minus;</button>
          <input type="range" id="tempoRange" min="40" max="200" step="1" value="90"
                 aria-label="Tempo in beats per minute" />
          <button class="tempo-btn" id="tempoUp" aria-label="Faster">+</button>
        </div>
      </div>
      <p class="hint">Plays in Explore mode.</p>
    </section>

    <p class="sheet-summary" id="sheetSummary"></p>

    <button class="start-btn" data-close>Done</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
